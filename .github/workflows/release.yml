# Builds a signed Android App Bundle + APK for Google Play.
# Run manually (Actions → Release → Run workflow) or by pushing a tag like v1.0.0.
#
# Secrets (repo Settings → Secrets → Actions; ideally in the "release" environment):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Variables (client-safe): SUPABASE_URL, SUPABASE_ANON_KEY, FIREBASE_*, REVENUECAT_*,
#   PRIVACY_POLICY_URL, TERMS_URL, SUPPORT_EMAIL
# iOS release builds run on Codemagic (codemagic.yaml).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require signing secrets and backend config
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/build-and-release.md."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL variable is not set; a release without a backend is useless."
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Write client config
        # Only client-safe values; server secrets never reach the app.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          REVENUECAT_ANDROID_KEY: ${{ vars.REVENUECAT_ANDROID_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_URL: ${{ vars.TERMS_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          {
            for k in SUPABASE_URL SUPABASE_ANON_KEY FIREBASE_API_KEY FIREBASE_PROJECT_ID \
                     FIREBASE_SENDER_ID FIREBASE_ANDROID_APP_ID REVENUECAT_ANDROID_KEY \
                     PRIVACY_POLICY_URL TERMS_URL SUPPORT_EMAIL; do
              echo "$k=${!k}"
            done
          } > "$RUNNER_TEMP/release.env"

      - name: Build App Bundle and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build appbundle --release --build-number=${{ github.run_number }} \
            --dart-define-from-file="$RUNNER_TEMP/release.env"
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define-from-file="$RUNNER_TEMP/release.env"

      - name: Verify the bundle is signed with the release key
        run: |
          for f in build/app/outputs/bundle/release/app-release.aab \
                   build/app/outputs/flutter-apk/app-release.apk; do
            certs=$(keytool -printcert -jarfile "$f")
            if [ -z "$certs" ] || echo "$certs" | grep -q "CN=Android Debug"; then
              echo "::error::$f is unsigned or signed with the debug key"; exit 1
            fi
          done

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release.env"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: closer-release-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
